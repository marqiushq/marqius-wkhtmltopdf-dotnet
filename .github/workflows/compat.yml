name: Beside DinkToPdf

# The same documents (tests/compat/Cases.cs: every setting of DinkToPdf that changes a PDF) made by
# DinkToPdf 1.0.8 with the libwkhtmltox 0.12.4 its repository carries, and by Marqius.DinkToPdf, on
# Linux x64 and Windows, then compared by marqius-wkhtmltopdf compare. The verdicts are in the run's
# summary; marked-up PDFs and page pictures of any difference are kept as an artifact for a week.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # each release runs it before publishing (release.yml)

permissions:
  contents: read

concurrency:
  # per calling workflow: a push's run never cancels the one a release is waiting on; only a pull
  # request's newer run replaces its older one
  group: compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compat:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # GitHub's Ubuntu machines carry Microsoft's apt repository as well as Ubuntu's. On 27 Nov 2026
      # it answered 403, and `apt-get update` failed the run. A customer's Ubuntu has only Ubuntu's
      # sources (in sources.list on 22.04, sources.list.d/ubuntu.sources from 24.04), so only those stay.
      - name: Only Ubuntu's own apt sources, as on a customer's machine
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo find /etc/apt/sources.list.d -mindepth 1 -maxdepth 1 ! -type d ! -name ubuntu.sources -print -delete
      - name: libwkhtmltox's system libraries, and fonts both sides use
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-6 libxext6 libxrender1 libfontconfig1 libfreetype6 fonts-liberation fonts-dejavu-core
      - name: The latest release's programs, checked, in both packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build.py "$(python .github/release.py latest)"
      - name: The same documents, by DinkToPdf with libwkhtmltox and by Marqius.DinkToPdf, compared
        run: python tests/compat.py compat-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compat-${{ matrix.os }}
          path: compat-out
          retention-days: 7
