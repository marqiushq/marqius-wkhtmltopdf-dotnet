name: Benchmark

# The same invoice made by Marqius.DinkToPdf, by DinkToPdf with libwkhtmltox 0.12.4, and by
# PuppeteerSharp with headless Chromium, on one GitHub machine: the first PDF of a new process, each
# PDF after that, 100 PDFs 8 at a time, and the space each needs on the server (tests/bench.py).
# The README's figures come from a run of this workflow, linked beside them.

on:
  push:
    branches: [main]
    paths: ["tests/bench/**", "tests/bench.py", ".github/workflows/benchmark.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # GitHub's Ubuntu machines carry Microsoft's apt repository as well as Ubuntu's. On 27 Nov 2026
      # it answered 403, and `apt-get update` failed the run. A customer's Ubuntu has only Ubuntu's
      # sources (in sources.list on 22.04, sources.list.d/ubuntu.sources from 24.04), so only those stay.
      - name: Only Ubuntu's own apt sources, as on a customer's machine
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo find /etc/apt/sources.list.d -mindepth 1 -maxdepth 1 ! -type d ! -name ubuntu.sources -print -delete
      - name: libwkhtmltox's system libraries, and the fonts all three use
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-6 libxext6 libxrender1 libfontconfig1 libfreetype6 fonts-liberation
      - name: The latest release's programs, checked, in both packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build.py "$(python .github/release.py latest)"
      - name: Three converters, one invoice
        run: python tests/bench.py bench-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark
          path: bench-out
          retention-days: 90
